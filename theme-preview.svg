<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">So About Us color theme preview</title>
  <desc id="desc">Warm cream, terracotta, charcoal, sage, gold, rust, and lavender palette with a sample dashboard card.</desc>
  <rect width="900" height="560" fill="#F7F1E8"/>
  <text x="56" y="62" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#292622">So About Us</text>
  <text x="56" y="91" font-family="Arial, sans-serif" font-size="16" fill="#756E66">Warm, calm, private journal theme</text>

  <g font-family="Arial, sans-serif">
    <rect x="56" y="124" width="110" height="82" rx="14" fill="#E06F52"/>
    <text x="70" y="229" font-size="13" fill="#292622">Terracotta</text>
    <text x="70" y="247" font-size="12" fill="#756E66">#E06F52</text>

    <rect x="186" y="124" width="110" height="82" rx="14" fill="#FFFFFF" stroke="#E6DED4"/>
    <text x="200" y="229" font-size="13" fill="#292622">Card white</text>
    <text x="200" y="247" font-size="12" fill="#756E66">#FFFFFF</text>

    <rect x="316" y="124" width="110" height="82" rx="14" fill="#292622"/>
    <text x="330" y="229" font-size="13" fill="#292622">Charcoal</text>
    <text x="330" y="247" font-size="12" fill="#756E66">#292622</text>

    <rect x="446" y="124" width="110" height="82" rx="14" fill="#A8C3A0"/>
    <text x="460" y="229" font-size="13" fill="#292622">Soft sage</text>
    <text x="460" y="247" font-size="12" fill="#756E66">#A8C3A0</text>

    <rect x="576" y="124" width="110" height="82" rx="14" fill="#E5B85C"/>
    <text x="590" y="229" font-size="13" fill="#292622">Warm gold</text>
    <text x="590" y="247" font-size="12" fill="#756E66">#E5B85C</text>

    <rect x="706" y="124" width="110" height="82" rx="14" fill="#B96955"/>
    <text x="720" y="229" font-size="13" fill="#292622">Muted rust</text>
    <text x="720" y="247" font-size="12" fill="#756E66">#B96955</text>

    <rect x="56" y="287" width="760" height="210" rx="22" fill="#FFFFFF" stroke="#E6DED4"/>
    <text x="84" y="327" font-size="15" font-weight="700" fill="#756E66">TODAY'S REFLECTION</text>
    <text x="84" y="382" font-size="56" font-weight="700" fill="#292622">78</text>
    <text x="176" y="372" font-size="15" fill="#756E66">Medium confidence</text>
    <rect x="176" y="388" width="190" height="10" rx="5" fill="#EDE5DA"/>
    <rect x="176" y="388" width="148" height="10" rx="5" fill="#E06F52"/>
    <text x="84" y="437" font-size="15" fill="#292622">More positive connection was recorded this week.</text>
    <text x="84" y="463" font-size="15" fill="#756E66">Childcare support may need a conversation.</text>
    <rect x="624" y="371" width="148" height="48" rx="24" fill="#E06F52"/>
    <text x="655" y="401" font-size="14" font-weight="700" fill="#FFFFFF">View details</text>
  </g>
</svg>
