[build]
  command = "npm run build"
  publish = "dist"

# Keep auth cookies on the frontend origin while FastAPI handles requests.
[[redirects]]
  from = "/api/*"
  to = "https://so-about-us-ab4b18b5d8b8.herokuapp.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
